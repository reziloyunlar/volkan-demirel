<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Volkan Demirel Top Kontrol Madness</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#08111e;color:#fff;font-family:Consolas,Monaco,monospace;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;height:100dvh}
  #wrap{position:relative;width:min(100vw,133.333vh);width:min(100vw,133.333dvh);aspect-ratio:4/3;background:#000;box-shadow:0 0 0 3px #1b2e49,0 12px 40px #0009}
  canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
  #bStart{display:none;position:absolute;left:50%;transform:translateX(-50%);z-index:5;padding:.45em 1.3em;font:900 clamp(16px,3.6vw,30px) "Arial Black",Impact,Arial,sans-serif;color:#07112b;background:#ffd52d;border:3px solid #fff;border-radius:14px;box-shadow:0 4px 0 #8a6d00;touch-action:manipulation;-webkit-tap-highlight-color:transparent;outline:none;white-space:nowrap}
  #bStart.s{top:66%}
  #bStart.o{top:77%}
  /* dokunmatik kontroller (sadece telefon/tablet) */
  #pad{display:none;width:min(100vw,133.333vh);width:min(100vw,133.333dvh);box-sizing:border-box;padding:14px 12px calc(14px + env(safe-area-inset-bottom));justify-content:space-between;align-items:center;gap:10px;touch-action:none}
  body.touch #pad{display:flex}
  #pad .grp{display:flex;gap:10px}
  #pad button{font:900 30px/1 "Arial Black",Impact,Arial,sans-serif;color:#e6edf8;background:#07112b;border:3px solid #dfe8f5;border-radius:14px;height:84px;min-width:84px;padding:0 10px;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;outline:none}
  #pad button.on{background:#1aa5c8;color:#07112b}
  #pad #bPopo{min-width:160px;color:#ffc62d;font-size:24px}
  #pad #bPopo.on{color:#07112b}
  @media (orientation:landscape) and (max-height:520px){
    #pad{position:fixed;left:50%;transform:translateX(-50%);bottom:6px;padding:0 10px;pointer-events:none}
    #pad button{pointer-events:auto;opacity:.62;height:64px;min-width:64px}
    #pad #bPopo{min-width:120px;font-size:20px}
  }
</style>
</head>

const F='"Arial Black",Impact,"Helvetica Neue",Arial,sans-serif';

/* ---------- düşük çözünürlüklü sahne (piksel görünümü) ---------- */
const lo=document.createElement('canvas');lo.width=W/S;lo.height=H/S;
const lctx=lo.getContext('2d');
const bgc=document.createElement('canvas');bgc.width=W/S;bgc.height=H/S;
const bctx=bgc.getContext('2d');
[lctx,bctx].forEach(x=>{x.setTransform(1/S,0,0,1/S,0,0);x.imageSmoothingEnabled=false});
let g=lctx;

const sn=v=>Math.round(v/S)*S;
function rect(x,y,w,h,col){
  const x0=sn(x),y0=sn(y),x1=sn(x+w),y1=sn(y+h);
  g.fillStyle=col;g.fillRect(x0,y0,Math.max(S,x1-x0),Math.max(S,y1-y0));
}
function poly(pts,fill,stroke,lw){
  g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();
  if(fill){g.fillStyle=fill;g.fill()}
  if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||4;g.stroke()}
}
function line(x1,y1,x2,y2,col,lw){
  g.strokeStyle=col;g.lineWidth=lw;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
}
const lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- oyun durumu ---------- */
const goal={ lineLeft:377, lineRight:809 };
const keeper={ x:600, y:466, speed:300, state:'ready', frame:0, actionT:0 };

let keys={};
let score=0, misses=0, record=0;
try{record=+(localStorage.popoArcadeRecord||0)}catch{}
const saveRecord=()=>{try{localStorage.popoArcadeRecord=record}catch{}};
let started=false, gameOver=false, elapsed=0, spawnTimer=.55, shake=0;
let balls=[], particles=[], flashes=[];

addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if(e.code==='Space'&&!gameOver){started=true;triggerSit()}
  if(e.code==='Enter'){ if(gameOver) reset(); else started=true; }
  if(e.code==='KeyR') reset();
});
addEventListener('keyup',e=>keys[e.code]=false);

// ---- dokunmatik kontrol ----
let gameOverAt=0;
if(matchMedia('(pointer:coarse)').matches||'ontouchstart' in window||navigator.maxTouchPoints>0) document.body.classList.add('touch');
function startOrRestart(){
  if(gameOver){ if(performance.now()-gameOverAt>900) reset(); }
  else if(!started){ started=true; }
}
function hold(id,code){
  const el=document.getElementById(id);
  const down=e=>{e.preventDefault();keys[code]=true;el.classList.add('on');if(!started)started=true};
  const up=e=>{e.preventDefault();keys[code]=false;el.classList.remove('on')};
  el.addEventListener('pointerdown',down);
  el.addEventListener('touchstart',down,{passive:false});
  ['pointerup','pointercancel','touchend','touchcancel'].forEach(n=>el.addEventListener(n,up,{passive:false}));
}
hold('bL','ArrowLeft');hold('bR','ArrowRight');
(()=>{
  const el=document.getElementById('bPopo');
  const down=e=>{
    e.preventDefault();el.classList.add('on');
    if(gameOver){startOrRestart();return}
    started=true;triggerSit();
  };
  const up=e=>{e.preventDefault();el.classList.remove('on')};
  el.addEventListener('pointerdown',down);
  el.addEventListener('touchstart',down,{passive:false});
  ['pointerup','pointercancel','touchend','touchcancel'].forEach(n=>el.addEventListener(n,up,{passive:false}));
})();
const tapCanvas=e=>{e.preventDefault();startOrRestart()};
c.addEventListener('pointerdown',tapCanvas);
c.addEventListener('touchstart',tapCanvas,{passive:false});
c.addEventListener('click',startOrRestart);
// Büyük BAŞLA / TEKRAR OYNA düğmesi (en güvenilir yol: normal buton)
const bStart=document.getElementById('bStart');
bStart.addEventListener('touchstart',e=>{e.preventDefault();startOrRestart()},{passive:false});
bStart.addEventListener('click',startOrRestart);
let bStartState='';
function syncStartButton(){
  let st='';
  if(!started) st='s';
  else if(gameOver&&performance.now()-gameOverAt>900) st='o';
  if(st===bStartState) return;
  bStartState=st;
  if(!st){bStart.style.display='none';return}
  bStart.className=st;
  bStart.textContent=st==='s'?'▶ BAŞLA':'↻ TEKRAR OYNA';
  bStart.style.display='block';
}
document.addEventListener('contextmenu',e=>e.preventDefault());

function reset(){
  score=0;misses=0;elapsed=0;spawnTimer=.5;shake=0;
  balls=[];particles=[];flashes=[];gameOver=false;started=true;
  keeper.x=600;keeper.y=466;keeper.state='ready';keeper.frame=0;keeper.actionT=0;
}

function triggerSit(){
  if(keeper.state==='ready'){
    keeper.state='sit';keeper.actionT=.48;keeper.frame=0;
    beep(170,.035,'square',.025);
  }
}

function beep(freq,dur,type='square',gain=.02){
  try{
    const ac=beep.ac||(beep.ac=new (window.AudioContext||window.webkitAudioContext)());if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),gn=ac.createGain();
    o.type=type;o.frequency.value=freq;
    gn.gain.setValueAtTime(gain,ac.currentTime);
    gn.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+dur);
    o.connect(gn).connect(ac.destination);o.start();o.stop(ac.currentTime+dur);
  }catch{}
}

function spawnBall(){
  // Kırmızı oklarla işaretlenen sol-alt koridordan gelir
  const sx=-80+Math.random()*290;
  const sy=540+Math.random()*180;
  const tx=goal.lineLeft+35+Math.random()*(goal.lineRight-goal.lineLeft-70);
  const ty=405+Math.random()*72;
  balls.push({
    sx,sy,tx,ty,t:0,
    speed:.40+Math.min(.32,elapsed*.005)+Math.random()*.06,
    dead:false,saved:false
  });
}

function update(dt){
  if(!started||gameOver)return;
  elapsed+=dt;

  const dir=(keys.ArrowLeft||keys.KeyA?-1:0)+(keys.ArrowRight||keys.KeyD?1:0);
  keeper.x+=dir*keeper.speed*dt;
  keeper.x=Math.max(goal.lineLeft+25,Math.min(goal.lineRight-25,keeper.x));

  if(keeper.state==='sit'){
    keeper.actionT-=dt;
    const p=1-Math.max(0,keeper.actionT)/.48;
    keeper.frame=p<.33?0:p<.67?1:2;
    if(keeper.actionT<=0){keeper.state='ready';keeper.frame=0}
  }

  spawnTimer-=dt;
  if(spawnTimer<=0){
    spawnBall();
    const base=Math.max(.38,1.08-elapsed*.007);
    spawnTimer=base*(.8+Math.random()*.45);
  }

  for(const b of balls){
    if(b.dead)continue;
    b.t+=b.speed*dt;
    const x=lerp(b.sx,b.tx,b.t);
    const y=lerp(b.sy,b.ty,b.t);

    // popo çarpışma alanı (kalecinin arka tarafı)
    if(!b.saved&&b.t>.89&&b.t<1.055&&keeper.state==='sit'&&keeper.frame>=1){
      const bx=keeper.x-25;
      const by=keeper.y-(keeper.frame===1?22:8);
      if(Math.abs(x-bx)<48&&Math.abs(y-by)<48){
        b.saved=true;b.dead=true;score++;
        if(score>record){record=score;saveRecord()}
        impact(x,y);shake=7;
        beep(92,.065,'square',.045);
        setTimeout(()=>beep(58,.05,'square',.025),30);
      }
    }

    if(!b.saved&&b.t>=1.055){
      b.dead=true;misses++;shake=3;
      beep(48,.14,'sawtooth',.02);
      if(misses>=10){
        gameOver=true;gameOverAt=performance.now();
        record=Math.max(record,score);saveRecord();
      }
    }
  }
  balls=balls.filter(b=>!b.dead);

  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=210*dt;p.life-=dt}
  particles=particles.filter(p=>p.life>0);
  for(const f of flashes)f.life-=dt;
  flashes=flashes.filter(f=>f.life>0);
  shake=Math.max(0,shake-25*dt);

    const u=k/23;
    g.beginPath();g.moveTo(lerp(TL[0],TR[0],u),lerp(TL[1],TR[1],u));g.lineTo(lerp(BL[0],BR[0],u),lerp(BL[1],BR[1],u));g.stroke();

function drawBall(b){
  const t=Math.min(1,b.t);
  const x=lerp(b.sx,b.tx,t),y=lerp(b.sy,b.ty,t);
  const r=lerp(35,21,t);
  const dx=b.sx-b.tx,dy=b.sy-b.ty,len=Math.hypot(dx,dy);
  const ux=dx/len,uy=dy/len,nx=-uy,ny=ux;
  const L=60+r*3.2;

  // hız izi (parlak çizgiler)
  poly([[x+nx*r*.9,y+ny*r*.9],[x+ux*L+nx*r*1.9,y+uy*L+ny*r*1.9],[x+ux*L-nx*r*1.9,y+uy*L-ny*r*1.9],[x-nx*r*.9,y-ny*r*.9]],'rgba(235,255,225,.26)');
  for(let i=-3;i<=3;i++){
    const off=i*r*.42,ll=L*(.55+.12*((i+3)%3));
    line(x+nx*off,y+ny*off,x+ux*ll+nx*off*1.7,y+uy*ll+ny*off*1.7,`rgba(255,255,240,${.6-Math.abs(i)*.08})`,8);
  }

  // top gövdesi
  g.fillStyle='#1b2130';g.beginPath();g.arc(x,y,r+3,0,Math.PI*2);g.fill();
  g.fillStyle='#f6f2e4';g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();
  g.fillStyle='rgba(130,130,150,.30)';g.beginPath();g.arc(x+r*.18,y+r*.22,r*.82,0,Math.PI*2);g.arc(x-r*.05,y-r*.08,r*.86,0,Math.PI*2,true);g.fill();
  g.save();g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.clip();
  const sp=b.t*7;
  g.fillStyle='#1b2130';
  const pent=(cx,cy,rad,rot)=>{g.beginPath();for(let i=0;i<5;i++){const a=rot+i*Math.PI*2/5;i?g.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad):g.moveTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad)}g.closePath();g.fill()};
  pent(x,y,r*.36,sp);
  for(let i=0;i<5;i++){
    const a=sp+i*Math.PI*2/5+Math.PI/5;
    pent(x+Math.cos(a)*r*.95,y+Math.sin(a)*r*.95,r*.36,a);
    g.strokeStyle='#1b2130';g.lineWidth=3;
    g.beginPath();g.moveTo(x+Math.cos(a-Math.PI/5)*r*.36,y+Math.sin(a-Math.PI/5)*r*.36);g.lineTo(x+Math.cos(a)*r*.65,y+Math.sin(a)*r*.65);g.stroke();
  }
  g.restore();
}

function drawFlash(f){
  const k=f.life/.25,pts=[];
  for(let i=0;i<20;i++){
    const a=i*Math.PI/10,rr=(i%2?24:56)*(.6+.4*k);
    pts.push([f.x+Math.cos(a)*rr,f.y+Math.sin(a)*rr]);
  }
  poly(pts,'#ffd72d');
  const p2=pts.map(p=>[f.x+(p[0]-f.x)*.55,f.y+(p[1]-f.y)*.55]);
  poly(p2,'#fff4a0');
}

    T('REKOR: '+record+(score>=record&&score>0?'  ★ YENİ REKOR!':''),512,492,24,'center','#ffd32d');
    T('R / ENTER / DOKUN ile yeniden başla',512,527,18,'center','#9dd8ff');
  }
}

buildBackground();
let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
